<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Conecta.Net — Cadastro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <div class="container-form">
    <div class="card grande">
      <h2>Cadastro do Cliente</h2>
      <div class="grid">
        <div>
          <label for="nome">Nome</label>
          <input type="text" id="nome" placeholder="Nome completo" />
        </div>
        <div>
          <label for="cpf">CPF</label>
          <input type="text" id="cpf" placeholder="000.000.000-00" maxlength="14" />
        </div>
        <div>
          <label for="telefone">Telefone</label>
          <input type="text" id="telefone" placeholder="(00) 00000-0000" maxlength="15" />
        </div>
        <div>
          <label for="cidade">Cidade</label>
          <input type="text" id="cidade" placeholder="Sua cidade" />
        </div>
        <div>
          <label for="setor">Setor</label>
          <input type="text" id="setor" placeholder="Seu setor/bairro" />
        </div>
        <div>
          <label for="cep">CEP</label>
          <input type="text" id="cep" placeholder="00000-000" maxlength="9" />
        </div>
        <div>
          <label for="senha">Senha</label>
          <input type="password" id="senha" placeholder="Crie uma senha" />
        </div>
      </div>
      <p id="erro" class="erro" style="display:none"></p>
      <div class="botoes">
        <button class="btn-secundario" onclick="window.location.href='login.html'">Voltar</button>
        <button onclick="cadastrar()">Cadastrar</button>
      </div>
    </div>
  </div>
  <script src="../js/auth.js"></script>
  <script src="../js/cadastro.js"></script>
</body>
</html>
