<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Conecta.Net — Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <section class="container-login">
    <div class="lado-esquerdo">
      <h1>Conecta.Net</h1>
      <p>Internet rápida, segura e com os melhores pacotes para sua casa.</p>
      <div class="area-foto">
        <img src="../img/logo.png" alt="Logo da empresa" />
        <p>Sua Internet na palma da sua mão</p>
      </div>
    </div>
    <div class="lado-direito">
      <div class="card">
        <h2>Login</h2>
        <label for="cpf">CPF</label>
        <input type="text" id="cpf" placeholder="000.000.000-00" maxlength="14" />
        <label for="senha">Senha</label>
        <input type="password" id="senha" placeholder="Digite sua senha" />
        <p id="erro" class="erro" style="display:none"></p>
        <div class="botoes-login">
          <button onclick="fazerLogin()">Entrar</button>
        </div>
        <p class="cadastro-link" onclick="window.location.href='cadastro.html'">
          Clique aqui e faça o seu cadastro
        </p>
      </div>
    </div>
  </section>
  <script src="../js/auth.js"></script>
  <script src="../js/login.js"></script>
</body>
</html>
